name: Deploy archive browser
on:
  push:
    branches: [main]
    paths:
      - 'catalog.csv'
      - 'model-coverage.json'
      - 'model-history.json'
      - 'sources.json'
      - 'requirements.txt'
      - 'requirements-pages.txt'
      - 'abstracts/**'
      - 'figures/**'
      - '.github/brand.json'
      - 'scripts/build_pages.py'
      - 'scripts/model_timeline.py'
      - 'scripts/build_readers.py'
      - 'scripts/archive_reports.py'
      - 'site/**'
      - 'assets/branding/**'
      - 'assets/vendors/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            site
            abstracts
            figures
            assets/branding
            assets/vendors
            .github
          sparse-checkout-cone-mode: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pages.txt
      - uses: actions/configure-pages@v5
      - run: python scripts/build_pages.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
