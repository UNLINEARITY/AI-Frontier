{{page_header}}
<main class="model-directory" id="collection">
<div class="directory-heading"><div id="publisher-focus" class="publisher-focus" data-page-title="{{directory_title}} — AI Frontier"><h1>{{directory_title}}</h1></div><div class="directory-summary"><a class="text-link" href="index.html#publishers" data-publisher-return>↑ {{all_publishers}}</a><p>{{directory_intro}}</p></div></div>
<template id="publisher-choices">{{publisher_tiles}}</template>
<div class="filter-bar"><div class="filters">
<label class="search-field"><span aria-hidden="true">⌕</span><span class="sr-only">{{directory_search}}</span><input id="search" type="search" placeholder="{{directory_search}}" autocomplete="off"><kbd aria-hidden="true">/</kbd></label>
<label><span class="sr-only">{{all_publishers}}</span><select id="vendor"><option value="">{{all_publishers}}</option>{{publisher_options}}</select></label>
<label><span class="sr-only">{{all_categories}}</span><select id="category"><option value="">{{all_categories}}</option>{{category_options}}</select></label>
<label><span class="sr-only">{{directory_scope}}</span><select id="scope"><option value="all">{{all_models}}</option><option value="frontier">{{models}}</option>{{undated_scope_option}}</select></label>
</div></div>
<noscript><style>#timeline { display: none; }</style></noscript>
{{model_timeline}}
<section id="model-list" aria-label="{{directory_title}}"><div class="results-toolbar"><div><span id="result-count" aria-live="polite" data-label="{{results}}">{{timeline_count}} {{results}}</span><button id="clear" hidden>{{clear}} <span aria-hidden="true">×</span></button></div><label class="sort-field"><span class="sr-only">{{sort_label}}</span><select id="sort"><option value="newest">{{newest}}</option><option value="oldest">{{oldest}}</option><option value="title">{{alphabetical}}</option></select></label></div>
<div id="cards" class="cards model-rows">{{model_cards}}</div><div id="empty" class="empty-state" hidden><h2>{{empty}}</h2><button id="empty-clear">{{clear}} ↗</button></div>
</section>
</main>
{{page_footer}}
