<section id="timeline" class="timeline-section" aria-labelledby="timeline-heading" data-prefix="{{prefix}}" data-count-label="{{timeline_count_label}}">
<div class="section-heading"><h2 id="timeline-heading">{{timeline_title}}</h2><p id="timeline-range" aria-live="polite"></p></div>
<div class="timeline-tools"><div class="timeline-controls" role="group" aria-label="{{timeline_title}}"><button id="timeline-out" aria-label="{{timeline_zoom_out}}" title="{{timeline_zoom_out}}">−</button><span id="timeline-zoom" aria-live="polite">1×</span><button id="timeline-in" aria-label="{{timeline_zoom_in}}" title="{{timeline_zoom_in}}">+</button><button id="timeline-fit">{{timeline_fit}}</button><button id="timeline-latest">{{timeline_latest}} <span aria-hidden="true">→</span></button></div></div>
<div class="timeline-frame" data-ui><svg id="timeline-plot" role="group" tabindex="0" aria-label="{{timeline_pan}}" aria-describedby="timeline-gesture"><defs><clipPath id="timeline-clip"><rect id="timeline-clip-rect"/></clipPath></defs><g id="timeline-ticks" aria-hidden="true"></g><path id="timeline-axis" aria-hidden="true"/><g id="timeline-points" clip-path="url(#timeline-clip)"></g><text id="timeline-empty" class="timeline-empty" text-anchor="middle" hidden>{{timeline_empty}}</text></svg><div id="timeline-tooltip" class="timeline-tooltip" role="tooltip" hidden><img alt="" id="timeline-tooltip-logo"><div><span id="timeline-tooltip-publisher"></span><strong id="timeline-tooltip-model"></strong><time id="timeline-tooltip-date"></time></div></div></div>
<div class="timeline-footer"><span id="timeline-gesture">{{timeline_gesture}}</span><span id="timeline-visible-count"></span></div>
<div class="timeline-directory"><a id="timeline-models-link" href="#model-list">{{model_list_label}} <span aria-hidden="true">↓</span></a><span id="timeline-undated-count" data-label="{{timeline_undated}}"></span></div>
<script type="application/json" id="timeline-data">{{timeline_data}}</script>
</section>
