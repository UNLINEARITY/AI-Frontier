<section id="timeline" class="timeline-section" aria-labelledby="timeline-heading" data-prefix="{{prefix}}" data-count-label="{{timeline_count_label}}" data-kin-label="{{timeline_kin_label}}">
<div class="section-heading timeline-heading"><h2 id="timeline-heading">{{timeline_title}}</h2><p id="timeline-range" class="timeline-range" aria-live="polite"></p></div>
<div class="timeline-tools">
<div class="segmented timeline-spans" role="group" aria-label="{{timeline_span_label}}"><button type="button" data-span="all" aria-pressed="true">{{timeline_span_all}}</button><button type="button" data-span="730" aria-pressed="false">{{timeline_span_2y}}</button><button type="button" data-span="365" aria-pressed="false">{{timeline_span_1y}}</button><button type="button" data-span="182" aria-pressed="false">{{timeline_span_6m}}</button><button type="button" data-span="91" aria-pressed="false">{{timeline_span_3m}}</button></div>
<div class="timeline-controls" role="group" aria-label="{{timeline_title}}"><button type="button" id="timeline-out" class="icon-button" aria-label="{{timeline_zoom_out}}" title="{{timeline_zoom_out}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button><span id="timeline-zoom" aria-live="polite">1×</span><button type="button" id="timeline-in" class="icon-button" aria-label="{{timeline_zoom_in}}" title="{{timeline_zoom_in}}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button></div>
</div>
<div class="timeline-frame" data-ui tabindex="-1"><svg id="timeline-plot" role="group" tabindex="0" aria-label="{{timeline_pan}}" aria-describedby="timeline-gesture"><defs><clipPath id="timeline-clip"><rect id="timeline-clip-rect"/></clipPath></defs><g id="timeline-bands" aria-hidden="true"></g><g id="timeline-ticks" aria-hidden="true"></g><g id="timeline-years" aria-hidden="true"></g><path id="timeline-baseline" aria-hidden="true"/><path id="timeline-axis" aria-hidden="true"/><g id="timeline-stems" aria-hidden="true"></g><g id="timeline-points" clip-path="url(#timeline-clip)"></g><g id="timeline-guide" hidden aria-hidden="true"><line/><rect width="102" height="28" rx="4"/><text text-anchor="middle"/></g><text id="timeline-empty" class="timeline-empty" text-anchor="middle" hidden>{{timeline_empty}}</text></svg><div id="timeline-tooltip" class="timeline-tooltip" role="tooltip" hidden><img alt="" id="timeline-tooltip-logo"><div><strong id="timeline-tooltip-model"></strong><span id="timeline-tooltip-publisher"></span><time id="timeline-tooltip-date"></time></div></div></div>
<div class="timeline-overview" data-ui><svg id="timeline-overview" role="group" aria-label="{{timeline_overview_label}}" aria-describedby="timeline-overview-help"><g id="timeline-overview-points" aria-hidden="true"></g><g id="timeline-overview-years" aria-hidden="true"></g><rect id="timeline-overview-shade-start" class="overview-shade" y="8" height="58" aria-hidden="true"/><rect id="timeline-overview-shade-end" class="overview-shade" y="8" height="58" aria-hidden="true"/><rect id="timeline-overview-window" class="overview-window" data-brush="move" y="8" height="58" rx="4" role="slider" tabindex="0" aria-label="{{timeline_window_label}}" aria-orientation="horizontal"/><rect id="timeline-overview-window-hit" class="overview-window-hit" data-brush="move" y="8" height="58" aria-hidden="true"/><g id="timeline-overview-start" class="overview-handle" data-brush="start" role="slider" tabindex="0" aria-label="{{timeline_start_label}}" aria-orientation="horizontal"><rect class="overview-handle-hit" x="-12" y="4" width="24" height="66"/><rect class="overview-handle-bar" x="-3.5" y="21" width="7" height="32" rx="3.5"/></g><g id="timeline-overview-end" class="overview-handle" data-brush="end" role="slider" tabindex="0" aria-label="{{timeline_end_label}}" aria-orientation="horizontal"><rect class="overview-handle-hit" x="-12" y="4" width="24" height="66"/><rect class="overview-handle-bar" x="-3.5" y="21" width="7" height="32" rx="3.5"/></g></svg><p id="timeline-overview-help" class="sr-only">{{timeline_overview_help}}</p></div>
<div class="timeline-footer"><span id="timeline-gesture">{{timeline_gesture}}</span><span id="timeline-visible-count"></span></div>
<div class="timeline-directory"><a id="timeline-models-link" class="text-link" href="{{timeline_list_href}}"{{timeline_list_attrs}}>{{model_list_label}} <span aria-hidden="true">{{timeline_list_arrow}}</span></a><span id="timeline-undated-count" data-label="{{timeline_undated}}"></span></div>
<script type="application/json" id="timeline-data">{{timeline_data}}</script>
</section>
