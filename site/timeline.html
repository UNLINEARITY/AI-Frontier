<section id="timeline" class="timeline-section" aria-labelledby="timeline-heading" data-prefix="{{prefix}}" data-count-label="{{timeline_count_label}}">
<div class="section-heading"><h2 id="timeline-heading">{{timeline_title}}</h2><p id="timeline-range" aria-live="polite"></p></div>
<div class="timeline-tools"><div class="timeline-controls" role="group" aria-label="{{timeline_title}}"><button id="timeline-out" aria-label="{{timeline_zoom_out}}" title="{{timeline_zoom_out}}">−</button><span id="timeline-zoom" aria-live="polite">1×</span><button id="timeline-in" aria-label="{{timeline_zoom_in}}" title="{{timeline_zoom_in}}">+</button><button id="timeline-fit">{{timeline_fit}}</button><button id="timeline-latest">{{timeline_latest}} <span aria-hidden="true">→</span></button></div></div>
<div class="timeline-frame" data-ui tabindex="-1"><svg id="timeline-plot" role="group" tabindex="0" aria-label="{{timeline_pan}}" aria-describedby="timeline-gesture"><defs><clipPath id="timeline-clip"><rect id="timeline-clip-rect"/></clipPath></defs><g id="timeline-ticks" aria-hidden="true"></g><g id="timeline-years" aria-hidden="true"></g><path id="timeline-axis" aria-hidden="true"/><g id="timeline-stems" aria-hidden="true"></g><g id="timeline-points" clip-path="url(#timeline-clip)"></g><g id="timeline-guide" hidden aria-hidden="true"><line/><rect width="102" height="30"/><text text-anchor="middle"/></g><text id="timeline-empty" class="timeline-empty" text-anchor="middle" hidden>{{timeline_empty}}</text></svg><div id="timeline-tooltip" class="timeline-tooltip" role="tooltip" hidden><img alt="" id="timeline-tooltip-logo"><div><span id="timeline-tooltip-publisher"></span><strong id="timeline-tooltip-model"></strong><time id="timeline-tooltip-date"></time></div></div></div>
<div class="timeline-overview" data-ui><svg id="timeline-overview" role="group" aria-label="{{timeline_overview_label}}" aria-describedby="timeline-overview-help"><rect id="timeline-overview-window" class="overview-window" data-brush="move" y="8" height="58" role="slider" tabindex="0" aria-label="{{timeline_window_label}}" aria-orientation="horizontal"/><rect id="timeline-overview-window-hit" class="overview-window-hit" data-brush="move" y="8" height="58" aria-hidden="true"/><g id="timeline-overview-points" aria-hidden="true"></g><g id="timeline-overview-years" aria-hidden="true"></g><g id="timeline-overview-start" class="overview-handle" data-brush="start" role="slider" tabindex="0" aria-label="{{timeline_start_label}}" aria-orientation="horizontal"><rect class="overview-handle-hit" x="-12" y="4" width="24" height="66"/><rect class="overview-handle-bar" x="-3" y="12" width="6" height="50"/></g><g id="timeline-overview-end" class="overview-handle" data-brush="end" role="slider" tabindex="0" aria-label="{{timeline_end_label}}" aria-orientation="horizontal"><rect class="overview-handle-hit" x="-12" y="4" width="24" height="66"/><rect class="overview-handle-bar" x="-3" y="12" width="6" height="50"/></g></svg><p id="timeline-overview-help" class="sr-only">{{timeline_overview_help}}</p></div>
<div class="timeline-footer"><span id="timeline-gesture">{{timeline_gesture}}</span><span id="timeline-visible-count"></span></div>
<div class="timeline-directory"><a id="timeline-models-link" href="#model-list">{{model_list_label}} <span aria-hidden="true">↓</span></a><span id="timeline-undated-count" data-label="{{timeline_undated}}"></span></div>
<script type="application/json" id="timeline-data">{{timeline_data}}</script>
</section>
