<!-- TextFold document controls; the surrounding page supplies its own header. -->
<div class="reader-shell">
  <header class="topbar" hidden><div class="brand"><span>TextFold</span><a id="arxiv-link"></a></div><div class="legend" id="legend"></div><div class="tagline"></div><div class="langpick"><button id="langbtn"></button><div id="langmenu" hidden></div></div></header>
  <div id="doc" class="doc" data-level="4"></div>
  <div id="ghosts" aria-hidden="true"></div>
  <footer class="zoom"><button id="back" class="backpill" hidden></button><nav class="zoombar" id="zoombar" aria-label="Reading detail"></nav><div class="hint" id="hint" hidden></div></footer>
  <script type="application/json" id="paper-data"></script>
</div>
