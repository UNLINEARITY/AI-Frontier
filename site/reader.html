<!doctype html>
<html lang="{{lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09121e">
<title>{{title}} — AI Frontier</title><meta name="description" content="{{description}}">
<script src="{{prefix}}theme-init.js"></script><link rel="stylesheet" href="{{prefix}}style.css"><link rel="stylesheet" href="{{prefix}}reader.css"><script src="{{prefix}}shared.js" defer></script><script src="{{prefix}}reader.js" defer></script></head><body>
<a class="skip-link" href="#collection">{{skip}}</a><div class="reading-progress" aria-hidden="true"></div>
<header><div class="header-inner"><a class="brand" href="{{home}}"><span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M6 22V9l5 2v13M14 22V5l5 2v14M22 21V10l5 2v8" fill="none" stroke="currentColor" stroke-width="3"/><path d="M3 27Q17 17 30 23" fill="none" stroke="#60dece" stroke-width="2"/></svg></span>{{name}}</a><nav aria-label="{{switch_label}} / GitHub"><a class="language-link" href="{{switch}}" aria-label="{{switch_label}}" title="{{switch_label}}"><span class="language-label">{{switch_label}}</span><span class="language-compact" aria-hidden="true">{{switch_compact}}</span></a><details class="theme-menu"><summary aria-label="{{theme_label}}" title="{{theme_label}}"><svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A9 9 0 0 1 8.5 4 9 9 0 1 0 20 15.5Z"/></svg></summary><div class="theme-options" role="group" aria-label="{{theme_label}}"><span>{{theme_label}}</span><button data-theme-choice="light" aria-pressed="false">{{light_theme}}<span aria-hidden="true">✓</span></button><button data-theme-choice="dark" aria-pressed="false">{{dark_theme}}<span aria-hidden="true">✓</span></button><button data-theme-choice="system" aria-pressed="false">{{system_theme}}<span aria-hidden="true">✓</span></button></div></details><a class="star" href="{{repository}}"><svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.78 5.63L21 9.54l-4.5 4.39 1.06 6.2L12 17.2l-5.56 2.93 1.06-6.2L3 9.54l6.22-.91Z"/></svg><span class="star-label">{{star}}</span><span class="star-compact">Star</span><span aria-hidden="true">↗</span></a></nav></div></header>
<main class="reader" id="collection"><a class="reader-back" href="{{home}}?publisher={{vendor}}#collection">← {{back}}</a>
<article class="markdown-body">{{body}}</article>
<dialog class="image-viewer" aria-label="{{zoom}}"><div class="viewer-toolbar"><span id="viewer-title"></span><button class="viewer-close" aria-label="{{close}}">×</button></div><div class="viewer-scroll"><img id="viewer-image" alt=""></div></dialog>
</main><button id="back-top" aria-label="{{top}}" title="{{top}}" hidden>↑</button>

</body></html>
